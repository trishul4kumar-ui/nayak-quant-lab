name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" build
      - name: Verify installed Qt runtime
        run: python -c "from PySide6.QtWidgets import QApplication; print('Qt runtime import passed')"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/quantlab/ui/web/agent_desk/package-lock.json
      - name: Build local agent visuals
        working-directory: src/quantlab/ui/web/agent_desk
        run: npm ci --ignore-scripts && npm run build && npm audit --omit=dev
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/quantlab
      - name: Basic secret-pattern check
        run: python scripts/check_tracked_secrets.py
      - name: Optimized-mode safety suite
        run: >-
          python -O -m pytest -q
          tests/safety tests/broker_gateway tests/realtime_data tests/realtime_decision
          tests/digital_twin tests/production_shadow tests/execution_authorization
          tests/restricted_execution tests/live_ops
          tests/agents
      - name: Full test suite with coverage report
        run: pytest -q --cov=quantlab --cov-report=term-missing
      - name: Build distribution
        run: python -m build
